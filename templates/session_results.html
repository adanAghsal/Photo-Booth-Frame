<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7effa" />
  <link rel="icon" href="{{ app_base_path }}/favicon.ico" type="image/png" />
  <title>Hasil Photo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #382745;
      background: #f7effa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { width: min(100%, 980px); margin: 0 auto; }
    header { margin: 10px 0 24px; text-align: center; }
    h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); }
    header p { margin: 8px 0 0; color: #786982; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px; }
    .photo-card { overflow: hidden; border: 1px solid #eadcf0; border-radius: 18px; background: #fff; box-shadow: 0 8px 24px #4e27530f; }
    .preview { display: grid; min-height: 220px; place-items: center; padding: 12px; background: #f0e9f2; }
    .preview img { display: block; max-width: 100%; max-height: 62vh; object-fit: contain; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; }
    .card-footer strong { font-size: 14px; }
    .download { flex: 0 0 auto; padding: 10px 14px; border-radius: 11px; color: #fff; background: #7644a0; font-size: 13px; font-weight: 800; text-decoration: none; }
    .download:focus-visible { outline: 3px solid #ed9bd4; outline-offset: 3px; }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .preview { min-height: 180px; }
      .card-footer { align-items: stretch; flex-direction: column; }
      .download { text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hasil Photo</h1>
      <p>Simpan hasil gabungan dan foto satuanmu.</p>
    </header>
    <section class="photo-grid" aria-label="Foto hasil sesi">
      {% for item in files %}
      <article class="photo-card">
        <div class="preview">
          <img src="{{ item.view_url }}" alt="{{ item.label }}" loading="lazy" decoding="async" />
        </div>
        <div class="card-footer">
          <strong>{{ item.label }}</strong>
          <a class="download" href="{{ item.download_url }}">Unduh foto</a>
        </div>
      </article>
      {% endfor %}
    </section>
  </main>
</body>
</html>
